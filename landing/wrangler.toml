# Config de Cloudflare Workers (sitio estático con "static assets").
# El nombre tiene que coincidir con el Worker creado en el panel: "bereano".
# Cloudflare Builds corre `npm run build` (genera dist/) y después `npx wrangler deploy`.
name = "bereano"
compatibility_date = "2026-10-01"

[assets]
directory = "./dist"
# /privacidad.html también responde como /privacidad
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
