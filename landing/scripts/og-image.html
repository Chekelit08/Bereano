<!doctype html>
<!-- Plantilla de la imagen para compartir (og:image, 1200×630). Solo tipografía.
     Para regenerarla: node scripts/og-image.mjs  (necesita Playwright). -->
<html lang="es">
<head>
<meta charset="UTF-8" />
<style>
  @font-face { font-family: Fraunces; src: url(../node_modules/@fontsource-variable/fraunces/files/fraunces-latin-opsz-normal.woff2); font-weight: 100 900; }
  @font-face { font-family: Fraunces; font-style: italic; src: url(../node_modules/@fontsource-variable/fraunces/files/fraunces-latin-opsz-italic.woff2); font-weight: 100 900; }
  @font-face { font-family: Plex; src: url(../node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-400-normal.woff2); }
  html, body { margin: 0; }
  body {
    width: 1200px; height: 630px; box-sizing: border-box; padding: 48px 56px;
    background: #efe7d8; color: #16110d; position: relative; overflow: hidden;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .glow { position: absolute; right: -180px; top: -60px; width: 760px; height: 760px; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(184,61,24,.38), transparent 70%), radial-gradient(closest-side at 30% 70%, rgba(217,164,65,.35), transparent 70%);
    filter: blur(30px); }
  .mono { font-family: Plex, monospace; font-size: 15px; letter-spacing: .08em; text-transform: uppercase; color: #5e5146; position: relative; }
  .top { display: flex; justify-content: space-between; border-bottom: 1px solid #16110d33; padding-bottom: 14px; }
  .top b { color: #b83d18; font-weight: 400; }
  h1 { position: relative; font-family: Fraunces, serif; font-weight: 300; font-size: 150px; line-height: .9; letter-spacing: -.045em; margin: 0; font-variation-settings: "opsz" 144; }
  h1 em { color: #b83d18; }
  .bottom { position: relative; display: flex; justify-content: space-between; align-items: end; }
  .brand { font-family: Fraunces, serif; font-size: 36px; font-weight: 500; }
  .seal { width: 150px; height: 150px; position: relative; display: grid; place-items: center; }
  .seal svg { position: absolute; inset: 0; }
  .seal text { font-family: Plex, monospace; font-size: 13.5px; letter-spacing: .12em; fill: #16110d; }
  .seal span { width: 60px; height: 60px; border-radius: 50%; background: #b83d18; color: #fbf5ea; display: grid; place-items: center; font-size: 24px; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="top mono"><span><b>●</b> Lista de espera abierta</span><span>Estudio bíblico con IA · En español</span></div>
  <h1>Entiende la Biblia.<br /><em>Vívela</em> cada día.</h1>
  <div class="bottom">
    <div class="brand">Bereano</div>
    <div class="seal">
      <svg viewBox="0 0 200 200"><defs><path id="c" d="M100,100 m-80,0 a80,80 0 1,1 160,0 a80,80 0 1,1 -160,0" /></defs>
        <text textLength="500" lengthAdjust="spacing"><textPath href="#c">ESCUDRIÑANDO CADA DÍA LAS ESCRITURAS · HECHOS 17:11 ·</textPath></text></svg>
      <span>↓</span>
    </div>
  </div>
</body>
</html>
