name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  landing:
    name: Landing (tests y build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: landing/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: El build no contiene claves secretas
        run: |
          if grep -rEl 'service_role|sb_secret_|sk-ant-' dist; then
            echo "::error::Hay una clave secreta en el build de la landing"
            exit 1
          fi

  supabase:
    name: Supabase (migraciones y seguridad)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Migraciones + test de seguridad
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: ./supabase/tests/run-local.sh

  app:
    name: App (tipos, lint y datos de la Biblia)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo lint
      - run: npm test
      - name: Los datos de la Biblia coinciden con supabase/data/rv1909.json
        run: |
          npm run bible
          git diff --exit-code -- src/data/bible
      - name: La app no contiene claves secretas
        run: |
          if grep -rEl 'service_role|sb_secret_|sk-ant-' src app.json; then
            echo "::error::Hay una clave secreta en la app"
            exit 1
          fi
